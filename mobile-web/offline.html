<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#09090b" />
        <title>Curator.gg — Offline</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #09090b;
                color: #fff;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background: #09090b;
            }

            main {
                width: min(100% - 48px, 380px);
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: 28px;
            }

            p {
                margin: 12px 0 24px;
                color: #a1a1aa;
                line-height: 1.6;
            }

            button {
                width: 100%;
                border: 0;
                border-radius: 12px;
                padding: 14px 18px;
                background: #fff;
                color: #09090b;
                font: inherit;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>No internet connection</h1>
            <p>
                Curator.gg needs a connection to load your library and community
                data.
            </p>
            <button type="button" onclick="window.location.reload()">
                Try again
            </button>
        </main>
    </body>
</html>
