<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#09090b" />
        <title>Curator.gg</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #09090b;
                color: #fff;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background: #09090b;
            }

            main {
                width: min(100% - 48px, 360px);
                text-align: center;
            }

            .mark {
                display: grid;
                width: 56px;
                height: 56px;
                margin: 0 auto 20px;
                place-items: center;
                border-radius: 16px;
                background: #fff;
                color: #09090b;
                font-size: 24px;
                font-weight: 800;
            }

            h1 {
                margin: 0;
                font-size: 28px;
            }

            p {
                margin: 12px 0 0;
                color: #a1a1aa;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark">C</div>
            <h1>Curator.gg</h1>
            <p>Preparing your library…</p>
        </main>
    </body>
</html>
